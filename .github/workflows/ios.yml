name: iOS

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run baseline checks
        run: ./scripts/test_baseline.sh
