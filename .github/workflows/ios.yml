name: iOS

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: Build and test
    # The project needs Xcode 26 (iOS 26 SDK, default actor isolation). Pin
    # the exact version the app is built with locally, on a runner image that
    # ships it with an iPhone 17 Pro simulator.
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Run baseline checks
        env:
          DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5
        run: ./scripts/test_baseline.sh
